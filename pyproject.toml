[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "traffic-data-synth"
version = "0.1.0"
description = "Local traffic annotation and evidence verification research scaffold"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "SQLAlchemy>=2.0,<3",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "filelock>=3.16,<4",
]

[project.optional-dependencies]
models = ["openai>=2,<3"]
hf = ["huggingface_hub>=1.32,<2"]
beamng = ["beamngpy==1.35.1"]
postgres = ["psycopg[binary]>=3.2,<4"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "httpx>=0.28,<1", "build>=1.2,<2"]
kaggle = ["kaggle>=2.2.4,<3"]
tpu-test = [
  "jax==0.11.2",
  "numpy==2.5.3",
  "ml-dtypes==0.6.0",
  "pillow==12.3.0",
  "requests>=2.32,<3",
  "gguf==0.19.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["kaggle/vendor", "kaggle/*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I"]
